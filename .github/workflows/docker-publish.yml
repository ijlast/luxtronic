name: Build and Publish Multi-Arch Docker Images

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Generate tags depending on branch
      # ---------------------------------------------------------
      - name: Determine tags
        id: vars
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE_TAG=$(date +"v%Y.%m.%d-%H%M")

          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "release_tag=${DATE_TAG}" >> $GITHUB_OUTPUT

            echo "docker_tags<<EOF" >> $GITHUB_OUTPUT
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest" >> $GITHUB_OUTPUT
            echo "ghcr.io/${GITHUB_REPOSITORY}:${DATE_TAG}" >> $GITHUB_OUTPUT
            echo "ghcr.io/${GITHUB_REPOSITORY}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
            SNAPSHOT_TAG="snapshot-${SAFE_BRANCH}-${SHORT_SHA}"

            echo "release=false" >> $GITHUB_OUTPUT
            echo "release_tag=${SNAPSHOT_TAG}" >> $GITHUB_OUTPUT

            echo "docker_tags<<EOF" >> $GITHUB_OUTPUT
            echo "ghcr.io/${GITHUB_REPOSITORY}:${SNAPSHOT_TAG}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------------
      # Build and push multi-arch image
      # ---------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/aarch64
          push: true
          tags: ${{ steps.vars.outputs.docker_tags }}

      # ---------------------------------------------------------
      # Create GitHub Release ONLY for master
      # ---------------------------------------------------------
      - name: Create Release
        if: steps.vars.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "Luxtronic Release ${{ steps.vars.outputs.release_tag }}"
          generate_release_notes: true
