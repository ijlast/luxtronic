// See https://docs.spring.io/spring-boot/docs/2.1.2.RELEASE/gradle-plugin/reference/html/

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.2.10'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'com.diffplug.spotless' version '6.20.0'
	
    //id 'com.palantir.docker' version '0.27.0'
    
    //id 'maven-publish'
    
}

group = 'github.ijl'
version = '0.0.2-SNAPSHOT'

ext {
  lombokVersion = '1.18.46'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}



configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
    mavenCentral()
}


dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-hateoas'
  implementation 'org.springframework.boot:spring-boot-starter-web'

  implementation 'javax.annotation:javax.annotation-api:1.3.2'

  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    
  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
  testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  //testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
  testImplementation("org.testng:testng:7.9.0")

}

spotless {
  java {
    target 'src/**/*.java'
    // Import order: java, javax, org, lombok, github
    importOrder 'java','javax','org','lombok','github'
    removeUnusedImports()
    eclipse().configFile('.github/eclipse-formatter.xml')
  }
}

bootJar {
    archiveBaseName = 'luxtronic'
    archiveVersion =  version
}

test {
  useTestNG()
}
