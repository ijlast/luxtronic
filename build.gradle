// See https://docs.spring.io/spring-boot/docs/2.1.2.RELEASE/gradle-plugin/reference/html/

plugins {
  id 'java'
  id 'org.springframework.boot' version '4.0.6'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.diffplug.spotless' version '6.20.0'
}

group = 'github.ijl'
version = '0.0.3-SNAPSHOT'

ext {
  lombokVersion = '1.18.46'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}



configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
    mavenCentral()
}


dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-hateoas'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-hateoas-test'
  testImplementation "org.testng:testng:7.10.2"
  testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

spotless {
  java {
    eclipse().configFile('.github/eclipse-formatter.xml')
    target 'src/**/*.java'
    // Import order: java, javax, org, lombok, github
    importOrder 'java','javax','jakarta','org','lombok','github'
    removeUnusedImports()
    endWithNewline()
    lineEndings 'UNIX'
    trimTrailingWhitespace()
  }
}

bootJar {
    archiveBaseName = 'luxtronic'
    archiveVersion =  version
}

test {
  useTestNG()
}
